POST https://dev.azure.com/{organization}/{target-project}/_apis/git/repositories/{target-repo}/pushes?api-version=7.0

####################################################
import requests
from requests.auth import HTTPBasicAuth
import json

# Dane
organization = "twoja-organizacja"
project = "twoj-projekt"
repository_id = "nazwa-lub-id-repo"
branch = "main"
personal_access_token = "TUTAJ_WKLEJ_PAT"
folder_to_scan = "/"  # np. "/pipelines" jeśli masz dedykowany folder

# Pomocnicze
auth = HTTPBasicAuth('', personal_access_token)
api_version = "7.1-preview.1"

# Funkcja: Pobierz listę plików z repo
def get_yaml_files():
    url = f"https://dev.azure.com/{organization}/{project}/_apis/git/repositories/{repository_id}/items?recursionLevel=Full&scopePath={folder_to_scan}&versionDescriptor.version={branch}&includeContentMetadata=true&api-version=7.1-preview.1"
    response = requests.get(url, auth=auth)
    if response.status_code == 200:
        items = response.json().get('value', [])
        yaml_files = [item['path'] for item in items if item['path'].endswith(('.yml', '.yaml'))]
        return yaml_files
    else:
        print("❌ Błąd pobierania plików z repo:", response.text)
        return []

# Funkcja: Utwórz pipeline
def create_pipeline(yaml_path):
    name = f"pipeline: {yaml_path.strip('/').replace('/', '_')}"
    url = f"https://dev.azure.com/{organization}/{project}/_apis/pipelines?api-version={api_version}"
    data = {
        "name": name,
        "configuration": {
            "type": "yaml",
            "path": yaml_path,
            "repository": {
                "id": repository_id,
                "type": "azureReposGit",
                "name": repository_id,
                "defaultBranch": f"refs/heads/{branch}"
            }
        }
    }
    response = requests.post(url, auth=auth, headers={"Content-Type": "application/json"}, data=json.dumps(data))
    if response.status_code in [200, 201]:
        print(f"✅ Utworzono pipeline: {name}")
    elif response.status_code == 409:
        print(f"⚠️ Pipeline już istnieje: {name}")
    else:
        print(f"❌ Błąd tworzenia pipeline dla {yaml_path}: {response.status_code} {response.text}")

# Główna logika
yaml_files = get_yaml_files()
print(f"🔍 Znaleziono {len(yaml_files)} plików YAML.")

for yaml_file in yaml_files:
    create_pipeline(yaml_file)

