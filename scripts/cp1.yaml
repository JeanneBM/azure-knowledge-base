trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: credentials  # Grupa zmiennych z PAT
  - name: organization
    value: 'your-organization'  # Zastąp nazwą organizacji
  - name: project
    value: 'your-project'       # Zastąp nazwą projektu
  - name: repositoryId
    value: 'your-repo-id'      # Zastąp ID repozytorium (GUID)
  - name: repositoryName
    value: 'your-repo-name'    # Zastąp nazwą repozytorium (np. MyRepo)

steps:
  - checkout: self
    persistCredentials: true

  - script: |
      set -x  # Włącz debugowanie Bash
      echo "Starting pipeline creation process..."

      # Wyświetl wartości zmiennych dla debugowania
      echo "Organization: $(organization)"
      echo "Project: $(project)"
      echo "RepositoryId: $(repositoryId)"
      echo "RepositoryName: $(repositoryName)"
      echo "PAT (masked): [REDACTED]"

      # Upewnij się, że jq jest zainstalowane
      sudo apt-get update && sudo apt-get install -y jq

      # Test AUTH_TOKEN
      echo "Testing AUTH_TOKEN..."
      AUTH_TOKEN="Authorization: Basic $(echo -n ":$(PAT)" | base64 -w0)"
      test_response=$(curl -s -w "\n%{http_code}" \
        -H "$AUTH_TOKEN" \
        "https://dev.azure.com/$(organization)/$(project)/_apis/projects?api-version=7.1")
      test_http_code=$(echo "$test_response" | tail -n1)
      test_response_body=$(echo "$test_response" | sed -e '$d')

      echo "Test HTTP Status: $test_http_code"
      echo "Test Response: $test_response_body"

      # Sprawdź, czy test się powiódł
      if [ "$test_http_code" -ne 200 ]; then
        echo "Error: AUTH_TOKEN test failed (HTTP $test_http_code)"
        exit 1
      fi
      echo "AUTH_TOKEN test passed successfully!"

      # Funkcja do tworzenia pipeline'u
      create_pipeline() {
        local pipeline_name=$1
        local yaml_path=$2
        echo "Creating pipeline: $pipeline_name with YAML: $yaml_path"

        # Wykonaj żądanie i zapisz odpowiedź oraz status
        response=$(curl -s -w "\n%{http_code}" \
          -X POST \
          -H "$AUTH_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{
            "name": "'"$pipeline_name"'",
            "configuration": {
              "type": "yaml",
              "path": "'"$yaml_path"'",
              "repository": {
                "id": "$(repositoryId)",
                "name": "$(repositoryName)",
                "type": "azureReposGit"
              }
            }
          }' \
          "https://dev.azure.com/$(organization)/$(project)/_apis/pipelines?api-version=7.1-preview.1")

        # Oddziel odpowiedź od kodu HTTP
        http_code=$(echo "$response" | tail -n1)
        response_body=$(echo "$response" | sed -e '$d')

        echo "HTTP Status: $http_code for $pipeline_name"
        echo "Response: $response_body"

        # Sprawdź, czy żądanie się powiodło
        if [ "$http_code" -ne 200 ]; then
          echo "Error: Failed to create pipeline $pipeline_name (HTTP $http_code)"
          exit 1
        fi

        # Sprawdź, czy odpowiedź zawiera poprawny JSON
        if ! echo "$response_body" | jq . >/dev/null 2>&1; then
          echo "Error: Response is not valid JSON for $pipeline_name"
          exit 1
        fi

        # Wyodrębnij definitionId z odpowiedzi JSON
        pipeline_id=$(echo "$response_body" | jq -r '.id')
        if [ -z "$pipeline_id" ] || [ "$pipeline_id" = "null" ]; then
          echo "Error: Could not extract pipeline ID for $pipeline_name"
          exit 1
        fi

        # Wypisz adres URL pipeline'u
        pipeline_url="https://dev.azure.com/$(organization)/$(project)/_build?definitionId=$pipeline_id"
        echo "New pipeline created: $pipeline_url"
      }

      # Tworzenie pipeline'ów
      create_pipeline "Pipeline1" "pipeline1.yml"
      create_pipeline "Pipeline2" "pipeline2.yml"
      create_pipeline "Pipeline3" "pipeline3.yml"
    displayName: 'Create Pipelines via REST API'
    env:
      PAT: $(PAT)  # Użycie zmiennej PAT z grupy credentials

